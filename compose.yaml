name: store-auth
services:
  auth:
    build: .
    ports:
    - 127.0.0.1:${HTTP_PORT:-8084}:8080
    environment:
      ACCOUNT_URL: ${ACCOUNT_URL:-http://account:8080}
      JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/init-env.py}
      JWT_COOKIE_SECURE: 'false' # plain HTTP on localhost
    networks:
    - services
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/auth/health-check]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
networks:
  # Shared with the other store services (docker network create store-dev).
  services:
    name: store-dev
    external: true
